<!DOCTYPE html>

<!--We'll be using jQuery in order to inject our data into the HTML, and bind to certain events since we are not using a framework like Angular or React.-->
<link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/bootstrap@4.0.0/dist/css/bootstrap.min.css"
    integrity="sha384-Gn5384xqQ1aoWXA+058RXPxPg6fy4IWvTNh0E263XmFcJlSAwiGgFAW/dAiS6JXm"
    crossorigin="anonymous"
/>
<script
    src="https://cdn.jsdelivr.net/npm/bootstrap@4.0.0/dist/js/bootstrap.min.js"
    integrity="sha384-JZR6Spejh4U02d8jOt6vLEHfe/JQGiRRSQQxSfFWpi1MquVdAyjUar5+76PVCmYl"
    crossorigin="anonymous"
></script>
<!--
    It does not recognize the jQuery GET function as we can see in our console error. That's because by default, the jQuery CDN link we copied earlier, is using a slim version.
    So let's remove that from the URL in our script element. So let's scroll to the top, and in the first script element, on this line, we can see it contains a slim version.

    Since we're now using a different version of jQuery, the integrity property will no longer work, so we can take that out.
-->
<script
    src="https://code.jquery.com/jquery-3.2.1.min.js"
    crossorigin="anonymous"
></script>
<script
    src="https://cdn.jsdelivr.net/npm/popper.js@1.12.9/dist/umd/popper.min.js"
    integrity="sha384-ApNbgh9B+Y1QKtv3Rn7W3mgPxhU9K/ScQsAP7hUibX39j7fakFPskvXusvfa0b4Q"
    crossorigin="anonymous"
></script>

<script src="/socket.io/socket.io.js"></script>

<!--Then inside, we'll place a Bootstrap jumbotron. This will contain our message-sending elements, and the jumbotron is a Bootstrap component that allows us to focus or showcase specific elements on our site.-->
<div class="container">
    <br />
    <div class="jumbotron">
        <h1 class="display-4">Send Message</h1>
        <br />
        <input id="name" class="form-control" placeholder="Name" />
        <br />
        <textarea
            id="message"
            class="form-control"
            placeholder="Message"
        ></textarea>
        <br />
        <button id="send" class="btn btn-success">Send</button>
    </div>

    <div id="messages"></div>
</div>

<script>
    const socket = io();
    $(() => {
        $("#send").click(() => {
            let message = {
                name: $("#name").val(),
                message: $("#message").val(),
            };
            postMessage(message);
        });

        getMessages();
    });

    // This waits for a message from the server and then adds it instead of the user having to constantly refresh the page
    socket.on("message", addMessage);

    function addMessage(message) {
        $("#messages").append(
            `<h4> ${message.name} </h4> <p> ${message.message} </p>`
        );
    }

    function getMessages() {
        $.get("http://localhost:3000/messages", (data) => {
            data.forEach(addMessage);
        });
    }

    function postMessage(message) {
        $.post("http://localhost:3000/messages", message);
    }
</script>
