<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8" />
        <!--Quick way to get react to the page-->
        <script
            src="https://unpkg.com/react@17/umd/react.development.js"
            crossorigin
        ></script>
        <script
            src="https://unpkg.com/react-dom@17/umd/react-dom.development.js"
            crossorigin
        ></script>
        <title>React ⚛️</title>
    </head>
    <body>
        <div id="root"></div>
        <script type="text/javascript">
            // This will render a h1 element with some text and it will render it in the element with an id of "root"
            ReactDOM.render(
                React.createElement("h1", null, "Getting started with React"),
                document.getElementById("root")
            );
        </script>
    </body>
</html>
